# Cada vez que cambian los datos (la rutina de la mañana pushea promos.json),
# arma la imagen del día para publicar y la deja en hoy/.
#
# El commit lo hace el bot de GitHub, y ese commit no vuelve a disparar esto.
# La página https://lubelrivero-design.github.io/conquepago/hoy.html la muestra.

name: Imagen del día

on:
  push:
    branches: [main]
    paths: ['promos.json']
  workflow_dispatch:

permissions:
  contents: write

# Una imagen por vez: si la rutina sube datos dos veces seguidas, la segunda
# corrida espera a que termine la primera en vez de pisarse con ella.
concurrency:
  group: imagen-del-dia
  cancel-in-progress: false

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Armar la imagen
        run: node herramientas/imagen-del-dia.js

      - name: Subirla
        run: |
          git config user.name  "imagen del dia"
          git config user.email "imagen@users.noreply.github.com"
          git add hoy/
          if git diff --cached --quiet; then
            echo "La imagen es igual a la de ayer."
          else
            git commit -m "Imagen del $(cat hoy/fecha.txt)"
            # La rutina de la mañana a veces sube un segundo commit (cambios.md)
            # un minuto después de los datos, y el push de la imagen chocaba
            # con "fetch first" (25/9 y 28/9: la imagen del día no salía).
            # Se trae lo nuevo y se reintenta. Solo tocamos hoy/, así que el
            # rebase no puede tener conflictos.
            for intento in 1 2 3 4 5; do
              git pull --rebase -q && git push && exit 0
              echo "Choque al subir (intento $intento), reintento en 10 s"
              sleep 10
            done
            echo "::error::No se pudo subir la imagen después de 5 intentos."
            exit 1
          fi
